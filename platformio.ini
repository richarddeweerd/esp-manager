; `pio run` builds examples/Basic for every supported board.
; `pio test -e native` runs the host unit tests in test/.

[platformio]
src_dir = examples/Basic
default_envs = esp32dev, esp32-s3-devkitc-1, esp32-c3-devkitm-1

[env]
lib_deps = symlink://.

; Arduino-ESP32 core 3.x is only available through the pioarduino platform.
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Boards run the on-device tests (test/test_hw_*); the other test folders are host-only.
test_filter = test_hw_*

[env:esp32dev]
extends = esp32
board = esp32dev

[env:esp32-s3-devkitc-1]
extends = esp32
board = esp32-s3-devkitc-1
; Serial on the native USB port (USB-Serial/JTAG), which the test rig is connected to.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c3-devkitm-1]
extends = esp32
board = esp32-c3-devkitm-1

; Host tests compile the library sources directly instead of through `symlink://.`:
; with the library at the project root, the dependency finder drops Unity, which is
; installed inside that same folder (.pio/libdeps). Paths below are relative to src_dir.
; src/platform/ holds the real ESP32 hardware code; the tests use the fakes in test/fakes/.
[env:native]
platform = native
test_framework = unity
test_ignore = test_hw_*
lib_deps =
test_build_src = yes
build_src_filter = -<*> +<../../src/> -<../../src/platform/>
build_flags = -std=c++17 -Wall -Wextra -Werror -Isrc -Itest/fakes
